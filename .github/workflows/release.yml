name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish BikeFitnessApp.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath bikefitness-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bikefitness-win-x64
          path: bikefitness-win-x64.zip

  build-linux:
    name: Build Linux (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish BikeFitness.Avalonia/BikeFitness.Avalonia.csproj --configuration Release --runtime linux-x64 --self-contained true --output publish

      - name: Zip
        run: (cd publish && zip -r ../bikefitness-linux-x64.zip .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bikefitness-linux-x64
          path: bikefitness-linux-x64.zip

  release:
    name: Publish rolling release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'bikefitness-*'
          merge-multiple: true
          path: dist

      # Auto-generated release notes compare against a fixed base tag, so on a
      # rolling tag they freeze on the first release and, fed back as the
      # existing body, get duplicated on every run. Write the body explicitly.
      - name: Build release notes
        run: |
          {
            printf 'Rolling nightly build of `main` - %s\n\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Recent commits:\n\n'
            printf '```\n'
            git log --oneline --no-decorate -20
            printf '```\n'
          } > "$RUNNER_TEMP/nightly-notes.md"
          cat "$RUNNER_TEMP/nightly-notes.md"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: false
          overwrite_files: true
          body_path: ${{ runner.temp }}/nightly-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/bikefitness-win-x64.zip
            dist/bikefitness-linux-x64.zip
